<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineering Context Engine</title>
    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          var defineFetch = function(obj) {
            if (!obj) return;
            try {
              Object.defineProperty(obj, 'fetch', {
                get: function() { return currentFetch; },
                set: function(v) { currentFetch = v; },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          };
          defineFetch(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            defineFetch(Window.prototype);
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            defineFetch(globalThis);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
